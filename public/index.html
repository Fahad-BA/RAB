<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#222831">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <title>Read & Burn</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container index-container">
        <div class="card">
            <div class="header">
                <h1>🔥 Read & Burn</h1>
                <p>Upload text or file and get a temporary link (one hour)</p>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="text">Text</button>
                <button class="tab" data-tab="file">File</button>
            </div>

            
            <div id="textTab" class="tab-content active">
                <form id="textForm">
                    <div class="form-group">
                        <label for="textInput">Write text here:</label>
                        <textarea id="textInput" name="text" placeholder="Write the text you want to share temporarily..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="textSubmit">
                        Create temporary link
                    </button>
                </form>
            </div>

            
            <div id="fileTab" class="tab-content">
                <form id="fileForm">
                    <div class="form-group">
                        <label for="fileInput">Choose file:</label>
                        <input type="file" id="fileInput" name="file">
                    </div>
                    <button type="submit" class="btn btn-primary" id="fileSubmit">
                        Upload file
                    </button>
                </form>
            </div>

            
            <div id="result" class="result">
                <p id="resultText"></p>
                <div id="previewContainer" class="preview-container hidden"></div>
            </div>

        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;

                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(targetTab + 'Tab').classList.add('active');
            });
        });

        const resultDiv = document.getElementById('result');
        const resultText = document.getElementById('resultText');
        const previewContainer = document.getElementById('previewContainer');

        function showResult(success, message, url = null) {
            resultDiv.className = 'result ' + (success ? 'success' : 'error');
            resultText.innerHTML = message + (url ? `<br><br><a href="${url}" target="_blank">🔗 ${url}</a>` : '');
            resultDiv.style.display = 'block';
            previewContainer.classList.add('hidden');
        }

        async function showPreview(url) {
            try {
                const response = await fetch(`/api/info/${url.split('/').pop()}`);
                const data = await response.json();

                if (data.isImage) {
                    previewContainer.innerHTML = `<img src="${url}" alt="Preview">`;
                    previewContainer.classList.remove('hidden');
                }
            } catch (error) {
                console.log('Could not fetch preview info:', error);
            }
        }

        
        document.getElementById('textForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = document.getElementById('textInput').value.trim();
            if (!text) {
                showResult(false, 'Please write text before submitting');
                return;
            }

            const submitBtn = document.getElementById('textSubmit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating...';

            try {
                const response = await fetch('/upload/text', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: text
                });

                const data = await response.json();

                if (data.success) {
                    const url = data.url;
                    showResult(true, 'Temporary link created successfully! 🎉<br>Expires after one hour', url);
                    document.getElementById('textInput').value = '';
                } else {
                    showResult(false, 'Creation failed: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                showResult(false, 'Connection error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create temporary link';
            }
        });

        
        document.getElementById('fileForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) {
                showResult(false, 'Please choose a file before uploading');
                return;
            }

            const submitBtn = document.getElementById('fileSubmit');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';

            try {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);

                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    const url = data.url;
                    showResult(true, 'File uploaded successfully! 🎉<br>Expires after one hour', url);

                    // Show preview if it's an image
                    if (fileInput.files[0].type.startsWith('image/')) {
                        await showPreview(url);
                    }

                    fileInput.value = '';
                } else {
                    showResult(false, 'Upload failed: ' + (data.message || 'Unknown error'));
                }
            } catch (error) {
                showResult(false, 'Connection error: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload file';
            }
        });
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Add to home screen prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function showInstallPrompt() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>
</body>
</html>
