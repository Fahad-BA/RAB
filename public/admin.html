<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#222831">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <title>Admin - Read & Burn</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="admin-header">🔥 Admin Panel</h1>
            <div class="header-actions">
                <button onclick="loadUploads()" class="btn btn-primary">Refresh</button>
                <button onclick="logout()" class="btn btn-danger">Logout</button>
                <a href="/" class="btn btn-secondary">Back to Home</a>
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>Active Files</h3>
                <div class="value" id="totalFiles">0</div>
            </div>
            <div class="stat-card">
                <h3>Total Size</h3>
                <div class="value" id="totalSize">0 MB</div>
            </div>
        </div>

        <div class="uploads-list">
            <div id="uploadsList"></div>
        </div>

        <div class="footer">
            <p>All text and files are permanently deleted after one hour. No one can ever access them after deletion.</p>
        </div>
    </div>

    <script>
        let uploads = [];

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/login';
            } catch (error) {
                console.error('Error logging out:', error);
                window.location.href = '/login';
            }
        }

        async function loadUploads() {
            try {
                const response = await fetch('/api/admin/uploads');
                uploads = await response.json();
                renderUploads();
            } catch (error) {
                console.error('Error loading uploads:', error);
            }
        }

        function renderUploads() {
            const listContainer = document.getElementById('uploadsList');
            const totalFiles = document.getElementById('totalFiles');
            const totalSize = document.getElementById('totalSize');

            // Calculate stats
            const totalFilesCount = uploads.length;
            const totalSizeBytes = uploads.reduce((sum, u) => sum + u.size, 0);
            
            totalFiles.textContent = totalFilesCount;
            totalSize.textContent = formatBytes(totalSizeBytes);

            if (uploads.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📭</div>
                        <p>No active files currently</p>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = uploads.map(upload => {
                const timeLeft = upload.timeLeft;
                const progress = Math.min(100, (timeLeft / (60 * 60 * 1000)) * 100);
                
                let badge = '';
                let icon = '📄';
                if (upload.mimetype.startsWith('image/')) {
                    badge = '<span class="badge badge-image">Image</span>';
                    icon = '🖼️';
                } else if (upload.mimetype.startsWith('text/')) {
                    badge = '<span class="badge badge-text">Text</span>';
                    icon = '📝';
                } else {
                    badge = '<span class="badge badge-other">File</span>';
                }

                return `
                    <div class="upload-item" data-id="${upload.id}">
                        <div class="icon">${icon}</div>
                        <div class="info">
                            <h4>${upload.originalName}</h4>
                            <p>${formatBytes(upload.size)} • ${new Date(upload.uploadedAt).toLocaleString('en-US')}</p>
                            ${badge}
                        </div>
                        <div class="time">
                            <div class="progress">
                                <div class="progress-bar" style="width: ${progress}%"></div>
                            </div>
                            <div class="time-left">${formatTimeLeft(timeLeft)}</div>
                        </div>
                        <div class="actions">
                            <a href="/${upload.id}" target="_blank" class="btn btn-primary">View</a>
                            <button onclick="copyLink('${upload.url}')" class="btn btn-secondary">Copy</button>
                            <button onclick="deleteUpload('${upload.id}')" class="btn btn-danger">Delete</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function deleteUpload(id) {
            if (!confirm('Are you sure you want to delete this file?')) return;

            try {
                const response = await fetch(`/api/admin/delete/${id}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                
                if (result.success) {
                    uploads = uploads.filter(u => u.id !== id);
                    renderUploads();
                } else {
                    alert('Delete failed: ' + result.message);
                }
            } catch (error) {
                alert('Delete error: ' + error.message);
            }
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url).then(() => {
                alert('Link copied!');
            }).catch(() => {
                alert('Failed to copy link');
            });
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function formatTimeLeft(ms) {
            if (ms <= 0) return 'Expired';
            const minutes = Math.floor(ms / (60 * 1000));
            const seconds = Math.floor((ms % (60 * 1000)) / 1000);
            if (minutes > 0) {
                return `${minutes} min ${seconds} sec`;
            }
            return `${seconds} sec`;
        }

        // Auto-refresh every 10 seconds
        setInterval(loadUploads, 10000);
        setInterval(renderUploads, 1000);

        // Initial load
        loadUploads();
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Add to home screen prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function showInstallPrompt() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>
</body>
</html>
