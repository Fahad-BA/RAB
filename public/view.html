<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#222831">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <title>View File - Read & Burn</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container view-container">
        <div class="card view-card" id="content">
            <div class="header view-header">
                <h1>🔥 Read & Burn</h1>
                <p class="filename" id="filename">Loading...</p>
            </div>

            <div class="timer-section">
                <h2>🔥 Time Remaining</h2>
                <div class="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                <div class="timer-text" id="timerText">Calculating...</div>
            </div>

            <div class="file-preview" id="filePreview">
                <p>Loading file...</p>
            </div>

            <div class="actions">
                <button class="btn btn-primary" onclick="copyLink()">
                    📋 Copy Link
                </button>
                <button class="btn btn-danger" onclick="burnFile()">
                    🔥 Burn Page
                </button>
                <button class="btn btn-secondary" onclick="downloadFile()">
                    ⬇️ Download File
                </button>
            </div>
        </div>

        <div class="card error hidden" id="error">
            <div class="icon">🚫</div>
            <h2>File not found or expired</h2>
            <p>This file has been deleted or has expired</p>
            <br>
            <a href="/" class="btn btn-primary">Back to Home</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        let fileId = '';
        let fileData = null;
        let expiresAt = null;
        let timerInterval = null;

        async function loadFile() {
            fileId = window.location.pathname.split('/').pop();
            
            try {
                const response = await fetch(`/api/info/${fileId}`);
                
                if (!response.ok) {
                    throw new Error('File not found');
                }

                fileData = await response.json();
                
                // Parse expiresAt
                expiresAt = new Date(fileData.expiresAt).getTime();
                
                // Update UI
                document.getElementById('filename').textContent = fileData.originalName;
                
                // Load file preview
                if (fileData.isImage) {
                    document.getElementById('filePreview').innerHTML = `<img src="/api/file/${fileId}" alt="${fileData.originalName}">`;
                } else {
                    // Try to load as text
                    try {
                        const textResponse = await fetch(`/api/text/${fileId}`);
                        const text = await textResponse.text();
                        document.getElementById('filePreview').innerHTML = `<div class="text-content">${escapeHtml(text)}</div>`;
                    } catch {
                        document.getElementById('filePreview').innerHTML = `
                            <p>File type: ${fileData.mimetype}</p>
                            <p>Size: ${formatBytes(fileData.size)}</p>
                            <p>Click "Download File" to open it</p>
                        `;
                    }
                }
                
                // Start timer
                updateTimer();
                timerInterval = setInterval(updateTimer, 1000);
                
            } catch (error) {
                // Clear file preview and show error
                document.getElementById('filePreview').innerHTML = '<p>Loading file...</p>';
                document.getElementById('content').classList.add('hidden');
                document.getElementById('error').classList.remove('hidden');
            }
        }

        function updateTimer() {
            if (!expiresAt) return;

            const now = Date.now();
            const timeLeft = expiresAt - now;

            if (timeLeft <= 0) {
                document.getElementById('timerText').textContent = 'Expired';
                document.getElementById('progressFill').style.width = '0%';
                clearInterval(timerInterval);
                setTimeout(() => {
                    window.location.reload();
                }, 2000);
                return;
            }

            const totalDuration = 60 * 60 * 1000; // 1 hour
            const progress = Math.max(0, Math.min(100, (timeLeft / totalDuration) * 100));
            
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('timerText').textContent = formatTimeLeft(timeLeft);
        }

        async function copyLink() {
            const link = window.location.href;
            try {
                await navigator.clipboard.writeText(link);
                showToast('Link copied successfully!');
            } catch {
                showToast('Failed to copy link');
            }
        }

        async function burnFile() {
            if (!confirm('Are you sure you want to burn this page? The file will be permanently deleted!')) return;

            try {
                const response = await fetch(`/delete/${fileId}`, {
                    method: 'DELETE'
                });
                
                if (response.ok) {
                    showToast('Page burned successfully!');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                } else {
                    showToast('Failed to burn page');
                }
            } catch {
                showToast('Error burning page');
            }
        }

        function downloadFile() {
            window.location.href = `/download/${fileId}`;
        }

        function formatTimeLeft(ms) {
            if (ms <= 0) return 'Expired';
            
            const hours = Math.floor(ms / (60 * 60 * 1000));
            const minutes = Math.floor((ms % (60 * 60 * 1000)) / (60 * 1000));
            const seconds = Math.floor((ms % (60 * 1000)) / 1000);
            
            if (hours > 0) {
                return `${hours}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            } else if (minutes > 0) {
                return `${minutes}:${String(seconds).padStart(2, '0')}`;
            } else {
                return `${seconds} sec`;
            }
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Load file on page load
        loadFile();
    </script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('SW registered: ', registration);
                    })
                    .catch(registrationError => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }

        // Add to home screen prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        function showInstallPrompt() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    } else {
                        console.log('User dismissed the install prompt');
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>
</body>
</html>
